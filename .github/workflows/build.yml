name: Build VoidLink

on:
  push:
    branches: [Integration, "codex/**"]
  pull_request:
    branches: [Integration]
  workflow_dispatch:

jobs:
  ios:
    name: iOS regression archive
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Archive VoidLink
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/VoidLink.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

  tvos:
    name: tvOS 17+ build and archive
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build tvOS simulator
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLinkTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive tvOS device app
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLinkTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$PWD/build/VoidLinkTV.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
          ditto -c -k --sequesterRsrc --keepParent \
            "build/VoidLinkTV.xcarchive/Products/Applications/VoidLink TV.app" \
            build/VoidLinkTV.app.zip

      - name: Upload tvOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidLinkTV
          path: |
            build/VoidLinkTV.app.zip
            build/VoidLinkTV.xcarchive
          if-no-files-found: error
